# Al-Tarteel — full stack (PostgreSQL, Redis, API, Web)
# Usage: docker compose up -d
# Then: http://localhost:3010 (web), http://localhost:4010/api/v1 (API)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quran
      POSTGRES_PASSWORD: quran_secret
      POSTGRES_DB: quran_app
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quran -d quran_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4010:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://quran:quran_secret@postgres:5432/quran_app?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
      CORS_ORIGINS: http://localhost:3010,http://127.0.0.1:3010
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4010/api/v1
    ports:
      - "3010:3000"
    environment:
      NODE_ENV: production
      API_URL: http://api:4000/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
