name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy on the EC2 host
        required: true
        default: main

concurrency:
  group: production-aws
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
          APP_DIR: ${{ secrets.AWS_EC2_APP_DIR }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: ${{ secrets.AWS_EC2_PORT || 22 }}
          command_timeout: 150m
          envs: DEPLOY_BRANCH,APP_DIR,GH_REPO,GH_TOKEN
          script: |
            set -euo pipefail
            if [ -z "${APP_DIR:-}" ]; then APP_DIR=/var/www/quranpilot; fi
            if [ -z "${DEPLOY_BRANCH:-}" ]; then DEPLOY_BRANCH=main; fi
            if [ -z "${GH_REPO:-}" ]; then GH_REPO=tassadaqhussain/Al-Tarteel-web; fi

            sudo mkdir -p "$(dirname "$APP_DIR")"
            GIT_URL="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Cloning $GH_REPO into $APP_DIR ($DEPLOY_BRANCH)"
              sudo rm -rf "$APP_DIR"
              sudo git clone --branch "$DEPLOY_BRANCH" "$GIT_URL" "$APP_DIR"
            else
              echo "Updating existing repo at $APP_DIR"
              cd "$APP_DIR"
              # Server remotes are often git@github.com (SSH). Actions has no server SSH key to GitHub.
              sudo git remote set-url origin "$GIT_URL"
              sudo git fetch origin "$DEPLOY_BRANCH"
              sudo git checkout "$DEPLOY_BRANCH"
              sudo git reset --hard "origin/$DEPLOY_BRANCH"
            fi
            sudo git -C "$APP_DIR" remote set-url origin "https://github.com/${GH_REPO}.git"

            cd "$APP_DIR"
            export SITEMAP_LASTMOD="${SITEMAP_LASTMOD:-$(git log -1 --format=%cI)}"
            export NEXT_PUBLIC_BUILD_DATE="${NEXT_PUBLIC_BUILD_DATE:-$SITEMAP_LASTMOD}"
            if ! command -v docker >/dev/null 2>&1; then
              echo "First install: docker/nginx missing — running deploy-production.sh"
              # Includes spoken-translation audio mirror (EN/UR/FA + Pashto) on first run
              sudo bash "$APP_DIR/scripts/deploy-production.sh" -y --skip-ssl
            else
              # run-production auto-mirrors translation audio when deploy/.audio-imported is missing
              sudo bash "$APP_DIR/scripts/run-production.sh" -y
            fi
