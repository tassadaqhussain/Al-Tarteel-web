name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy on the EC2 host
        required: true
        default: main

concurrency:
  group: production-aws
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
          APP_DIR: ${{ secrets.AWS_EC2_APP_DIR }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: ${{ secrets.AWS_EC2_PORT || 22 }}
          command_timeout: 150m
          envs: DEPLOY_BRANCH,APP_DIR,GH_REPO,GH_TOKEN
          script: |
            set -euo pipefail
            if [ -z "${APP_DIR:-}" ]; then APP_DIR=/var/www/quranpilot; fi
            if [ -z "${DEPLOY_BRANCH:-}" ]; then DEPLOY_BRANCH=main; fi
            if [ -z "${GH_REPO:-}" ]; then GH_REPO=tassadaqhussain/Al-Tarteel-web; fi

            free_mb() {
              df -Pm "${1:-/}" 2>/dev/null | awk 'NR==2 {print $4}'
            }

            echo "Cleaning dangling Docker resources before deploy"
            sudo docker system prune -f 2>/dev/null || true
            df -h /
            echo "Disk before deploy: $(free_mb /) MB free on /"
            # Docker BuildKit cache + previous images can silently fill the root volume;
            # keep at least ~5 GB free before building Next.js + NestJS images.
            if [ "$(free_mb /)" -lt 5120 ]; then
              echo "Low disk (<5 GB) — pruning unused Docker images, BuildKit cache, and logs"
              # Do NOT pass --volumes (would risk deleting Postgres data volumes).
              sudo docker builder prune -af 2>/dev/null || true
              sudo docker system prune -af 2>/dev/null || true
              sudo journalctl --vacuum-size=200M 2>/dev/null || true
              sudo apt-get clean 2>/dev/null || true
              sudo rm -rf "${APP_DIR}/backend/storage/audio/ur-farhat-hashmi" 2>/dev/null || true
              sudo rm -f "${APP_DIR}/.git/config.lock" 2>/dev/null || true
              df -h /
              echo "Disk after cleanup: $(free_mb /) MB free on /"
            fi
            if [ "$(free_mb /)" -lt 1024 ]; then
              echo "FATAL: only $(free_mb /) MB free on /. Free disk on the EC2 host, then re-run deploy."
              echo "  sudo docker builder prune -af && sudo docker system prune -af"
              echo "  sudo rm -rf ${APP_DIR}/backend/storage/audio/ur-farhat-hashmi"
              echo "  df -h /"
              exit 1
            fi

            sudo mkdir -p "$(dirname "$APP_DIR")"
            GIT_URL="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
            # Never rewrite .git/config (fails with ENOSPC / config.lock on a full disk).
            # Fetch the branch URL directly so Actions does not need a server SSH key.
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Cloning $GH_REPO into $APP_DIR ($DEPLOY_BRANCH)"
              sudo rm -rf "$APP_DIR"
              sudo git clone --branch "$DEPLOY_BRANCH" "$GIT_URL" "$APP_DIR"
            else
              echo "Updating existing repo at $APP_DIR (no remote set-url)"
              sudo rm -f "$APP_DIR/.git/config.lock"
              sudo git -C "$APP_DIR" fetch --prune --force "$GIT_URL" \
                "+refs/heads/${DEPLOY_BRANCH}:refs/remotes/origin/${DEPLOY_BRANCH}"
              sudo git -C "$APP_DIR" checkout -f -B "$DEPLOY_BRANCH" "origin/${DEPLOY_BRANCH}"
              sudo git -C "$APP_DIR" reset --hard "origin/${DEPLOY_BRANCH}"
              sudo git -C "$APP_DIR" clean -fd -e deploy/.last-deployed-sha -e deploy/.db-synced -e deploy/.audio-imported -e deploy/audio-import.log
            fi

            cd "$APP_DIR"
            export SITEMAP_LASTMOD="${SITEMAP_LASTMOD:-$(git log -1 --format=%cI)}"
            export NEXT_PUBLIC_BUILD_DATE="${NEXT_PUBLIC_BUILD_DATE:-$SITEMAP_LASTMOD}"
            if ! command -v docker >/dev/null 2>&1; then
              echo "First install: docker/nginx missing — running deploy-production.sh"
              # Audio mirror is opt-in (--import-audio) — needs several GB free on the host
              sudo bash "$APP_DIR/scripts/deploy-production.sh" -y --skip-ssl
            else
              sudo bash "$APP_DIR/scripts/run-production.sh" -y
            fi

            # Reclaim dangling images and trim BuildKit cache after deploy so disk stays healthy.
            sudo docker image prune -f 2>/dev/null || true
            sudo docker builder prune -f --keep-storage=1GB 2>/dev/null || true
            echo "Disk after deploy: $(free_mb /) MB free on /"
