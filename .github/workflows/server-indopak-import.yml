name: Server IndoPak import

on:
  workflow_dispatch:

concurrency:
  group: production-aws
  cancel-in-progress: false

jobs:
  import:
    name: Run IndoPak backfill on EC2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Import IndoPak text over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_DIR: ${{ secrets.AWS_EC2_APP_DIR }}
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: ${{ secrets.AWS_EC2_PORT || 22 }}
          command_timeout: 40m
          envs: APP_DIR
          script: |
            set -euo pipefail
            if [ -z "${APP_DIR:-}" ]; then APP_DIR=/var/www/quranpilot; fi
            cd "$APP_DIR"
            sudo git fetch origin main
            sudo git checkout main
            sudo git reset --hard origin/main
            sudo bash scripts/import-indopak.sh
