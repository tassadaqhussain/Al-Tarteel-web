# Drop automated probes that POST with a fake short Next-Action header (react2shell scanners).
# Install to /etc/nginx/conf.d/00-next-action-filter.conf and reload nginx.
# Valid Server Action IDs are 40+ character hashes; this app does not use Server Actions.

map $http_next_action $qp_invalid_next_action {
    default 0;
    ""      0;
    "~^.{1,39}$" 1;
}
